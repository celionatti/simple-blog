<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Serenity Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="brand">Serenity <span
                style="font-family: 'Inter', sans-serif; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-primary); margin-left: 0.5rem; font-weight: 400;">Shop</span>
        </div>
        <nav class="nav-links">
            <a href="cart.html">Return to Cart</a>
        </nav>
    </header>

        <div class="page-header">
            <h1>Safe Checkout</h1>
        </div>

        <div class="checkout-layout">
            <div class="checkout-form-column">
                <form class="checkout-form">
                    <section class="form-section">
                        <h2>Shipping Details</h2>
                        <div class="form-grid grid-2">
                            <div class="form-group">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-input" placeholder="e.g. Jane">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-input" placeholder="e.g. Doe">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-input" placeholder="e.g. jane@example.com">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-input" placeholder="Street address">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Apartment, suite, etc. (optional)</label>
                            <input type="text" class="form-input" placeholder="">
                        </div>

                        <div class="form-grid grid-3">
                            <div class="form-group">
                                <label class="form-label">City</label>
                                <input type="text" class="form-input" placeholder="City">
                            </div>
                            <div class="form-group">
                                <label class="form-label">State</label>
                                <select class="form-select">
                                    <option>Select State</option>
                                    <option>NY</option>
                                    <option>CA</option>
                                    <option>TX</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">ZIP Code</label>
                                <input type="text" class="form-input" placeholder="ZIP">
                            </div>
                        </div>
                    </section>

                    <section class="form-section">
                        <h2>Payment Method</h2>
                        <div class="payment-card-input">
                            <div class="payment-header">
                                <div class="payment-title">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                                        <line x1="1" y1="10" x2="23" y2="10"></line>
                                    </svg>
                                    Credit Card
                                </div>
                                <div class="card-icons">
                                    <!-- Icons would go here, represented by text/css for now -->
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <input type="text" class="form-input" placeholder="Card Number">
                            </div>
                            
                            <div class="form-grid grid-2">
                                <input type="text" class="form-input" placeholder="MM / YY">
                                <input type="text" class="form-input" placeholder="CVC">
                            </div>
                        </div>
                    </section>
                </form>
            </div>

            <div class="checkout-sidebar">
                <div class="checkout-summary sticky-summary">
                    <h3>Order Summary</h3>
                    
                    <div class="order-items-mini">
                        <div class="order-item-mini">
                            <div class="mini-thumb">
                                <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?ixlib=rb-4.0.3&auto=format&fit=crop&w=1170&q=80" alt="Sofa">
                            </div>
                            <div class="mini-info">
                                <p class="mini-title">Organic Linen Sofa</p>
                                <p class="mini-qty">Qty: 1</p>
                            </div>
                            <span class="mini-price">$1,250.00</span>
                        </div>
                        
                        <div class="order-item-mini">
                            <div class="mini-thumb">
                                <img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?ixlib=rb-4.0.3&auto=format&fit=crop&w=1170&q=80" alt="Vase">
                            </div>
                            <div class="mini-info">
                                <p class="mini-title">Ceramic Vase</p>
                                <p class="mini-qty">Qty: 1</p>
                            </div>
                            <span class="mini-price">$45.00</span>
                        </div>
                    </div>

                    <div class="summary-rows">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>$1,295.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping</span>
                            <span class="text-success">Free</span>
                        </div>
                         <div class="summary-row">
                            <span>Tax</span>
                            <span class="text-muted">Calculated at checkout</span>
                        </div>
                    </div>

                    <div class="summary-total">
                        <span>Total</span>
                        <span>$1,295.00</span>
                    </div>

                    <a href="confirmation.html" class="btn btn-primary btn-full pay-btn">
                        Pay $1,295.00
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="index.html" class="mobile-nav-item">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Shop</span>
        </a>
        <a href="#" class="mobile-nav-item">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Search</span>
        </a>
        <a href="cart.html" class="mobile-nav-item">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span>Cart</span>
        </a>
        <a href="account.html" class="mobile-nav-item active">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Account</span>
        </a>
    </nav>
</body>

</html>
