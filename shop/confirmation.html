<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - Serenity Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="brand">Serenity <span
                style="font-family: 'Inter', sans-serif; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-primary); margin-left: 0.5rem; font-weight: 400;">Shop</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Shop</a>
            <a href="#">New Arrivals</a>
            <a href="#">Home</a>
            <a href="#">Journal</a>
        </nav>
    </header>

    <main>
        <div class="confirmation-container">
            <div class="success-card">
                <div class="success-icon-wrapper">
                    <svg class="success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                
                <h1>Order Confirmed!</h1>
                <p class="confirmation-message">Thank you for your purchase. Your order <span class="order-id">#29384</span> is being processed and will ship soon.</p>
                
                <div class="order-details-card">
                    <h3>Order Summary</h3>
                    <div class="order-items-list">
                        <div class="order-item-row">
                            <span class="item-name">Organic Linen Sofa (x1)</span>
                            <span class="item-price">$1,250.00</span>
                        </div>
                        <div class="order-item-row">
                            <span class="item-name">Ceramic Vase (x1)</span>
                            <span class="item-price">$45.00</span>
                        </div>
                    </div>
                    <div class="order-total-row">
                        <span>Total Paid</span>
                        <span>$1,295.00</span>
                    </div>
                </div>
                
                <a href="index.html" class="btn btn-primary btn-wide">Continue Shopping</a>
            </div>
        </div>
    </main>
</body>

</html>
